<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>留言板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Helvetica Neue","Noto Sans CJK SC",sans-serif;background:#16213E;color:#FFF;padding:20px 0;-webkit-user-select:none;user-select:none;min-height:100vh;position:relative}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1A1A2E 0%,#16213E 50%,#0F3460 100%);z-index:-1;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.container{max-width:700px;margin:0 auto;padding:0 16px}

/* ===== 顶部栏 ===== */
.header{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;padding:16px 24px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;box-shadow:0 8px 32px rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.1)}
.header h2{font-size:20px;font-weight:700}
.header span{font-size:14px;color:rgba(255,255,255,0.7)}
.header a{color:#fff;text-decoration:none;background:rgba(255,82,82,0.2);padding:6px 16px;border-radius:20px;font-size:14px;border:1px solid rgba(255,82,82,0.3);transition:background 0.3s}
.header a:hover{background:rgba(255,82,82,0.4)}

/* ===== 认证框（登录/注册） ===== */
.auth-box{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:40px 30px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);max-width:400px;margin:40px auto}
.auth-box h2{text-align:center;margin-bottom:30px;font-size:24px;font-weight:700;color:#FFF}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:8px;color:rgba(255,255,255,0.7);font-size:14px}
.form-group input{width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,0.2);border-radius:12px;font-size:16px;background:rgba(255,255,255,0.1);color:#FFF;transition:border-color 0.3s;font-family:inherit}
.form-group input::placeholder{color:rgba(255,255,255,0.3)}
.form-group input:focus{outline:none;border-color:#4FC3F7}

/* ===== 按钮 ===== */
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#4FC3F7,#0288D1);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.3s,transform 0.2s;font-family:inherit}
.btn:hover{opacity:0.9}
.btn:active{transform:scale(0.98)}

/* ===== 链接 ===== */
.link{text-align:center;margin-top:24px;font-size:14px;color:rgba(255,255,255,0.5)}
.link a{color:#4FC3F7;text-decoration:none;font-weight:500}
.link a:hover{text-decoration:underline}

/* ===== 提示框 ===== */
.alert{padding:12px 16px;border-radius:10px;margin-bottom:20px;text-align:center;font-size:14px;border:1px solid transparent}
.alert.error{background:rgba(255,82,82,0.15);color:#FF5252;border-color:rgba(255,82,82,0.3)}
.alert.success{background:rgba(102,187,106,0.15);color:#66BB6A;border-color:rgba(102,187,106,0.3)}

/* ===== 发布框 ===== */
.post-box{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:24px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.1);margin-bottom:24px}
.post-box textarea{width:100%;min-height:300px;padding:14px;border:1px solid rgba(255,255,255,0.2);border-radius:12px;font-size:16px;resize:vertical;font-family:inherit;background:rgba(255,255,255,0.1);color:#FFF;transition:border-color 0.3s}
.post-box textarea::placeholder{color:rgba(255,255,255,0.3)}
.post-box textarea:focus{outline:none;border-color:#4FC3F7}
.post-box button{margin-top:12px;float:right;padding:10px 28px;border:none;border-radius:10px;background:linear-gradient(135deg,#4FC3F7,#0288D1);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.3s,transform 0.2s;font-family:inherit}
.post-box button:hover{opacity:0.9}
.post-box button:active{transform:scale(0.96)}
.clear{clear:both}

/* ===== 留言卡片 ===== */
.msg-card{background:rgba(255,255,255,0.05);padding:20px 24px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,0.1);margin-bottom:14px;border:1px solid rgba(255,255,255,0.1);transition:border-color 0.25s,background 0.25s}
.msg-card:hover{border-color:#4FC3F7;background:rgba(79,195,247,0.05)}

.msg-meta{display:flex;align-items:center;margin-bottom:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#4FC3F7,#0288D1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;margin-right:12px;font-size:16px}
.msg-info{flex:1}
.msg-info .name{font-weight:600;font-size:15px;color:#FFF}
.msg-info .time{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px}

/* ===== 操作按钮 ===== */
.msg-actions{display:flex;gap:6px}
.btn-action{padding:5px 12px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);border-radius:6px;font-size:12px;cursor:pointer;color:rgba(255,255,255,0.8);text-decoration:none;transition:all 0.2s;font-family:inherit}
.btn-action:hover{background:#4FC3F7;color:#FFF;border-color:#4FC3F7}
.btn-delete:hover{background:#FF5252;border-color:#FF5252}

/* ===== 留言内容 ===== */
.msg-content{white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:15px;color:rgba(255,255,255,0.85);max-height:240px;overflow:auto;padding-right:8px}
.msg-content::-webkit-scrollbar{width:6px}
.msg-content::-webkit-scrollbar-track{background:rgba(255,255,255,0.05);border-radius:3px}
.msg-content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:3px}

/* ===== 模态框 ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:2000;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal-box{background:#16213E;padding:32px 28px;border-radius:14px;max-width:380px;width:88%;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);animation:popIn 0.2s ease-out}
@keyframes popIn{from{transform:scale(0.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box p{margin-bottom:24px;font-size:16px;color:#FFF;line-height:1.5}
.modal-buttons{display:flex;gap:12px;justify-content:center}
.modal-btn{padding:10px 28px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:opacity 0.2s}
.modal-btn:hover{opacity:0.88}
.modal-btn.primary{background:#4FC3F7;color:#1A1A2E}
.modal-btn.cancel{background:rgba(255,255,255,0.15);color:#FFF}

.empty{text-align:center;color:rgba(255,255,255,0.4);padding:60px 0}
.hidden{display:none}

@media (max-width:600px){
  .auth-box{padding:30px 20px;margin:20px auto}
  .auth-box h2{font-size:22px;margin-bottom:24px}
  .header{padding:16px 20px;flex-wrap:wrap;gap:10px}
  .header h2{font-size:18px}
  .post-box,.msg-card{padding:16px}
}
</style>
</head>
<body>
<div class="container">

  <div id="auth" class="auth-box hidden">
    <div id="login-view">
      <h2>🔐 用户登录</h2>
      <div id="login-alert"></div>
      <div class="form-group"><label>用户名</label><input id="login-user" autocomplete="username"></div>
      <div class="form-group"><label>密码</label><input id="login-pass" type="password" autocomplete="current-password"></div>
      <button class="btn" onclick="login()">登录</button>
      <div class="link">没有账号？<a href="#" onclick="showReg()">去注册</a></div>
    </div>
    <div id="reg-view" class="hidden">
      <h2>✍️ 用户注册</h2>
      <div id="reg-alert"></div>
      <div class="form-group"><label>用户名</label><input id="reg-user"></div>
      <div class="form-group"><label>密码</label><input id="reg-pass" type="password"></div>
      <button class="btn" onclick="register()">注册</button>
      <div class="link">已有账号？<a href="#" onclick="showLogin()">去登录</a></div>
    </div>
  </div>

  <div id="board" class="hidden">
    <div class="header">
      <h2>💬 留言板</h2>
      <span>欢迎，<span id="uname"></span>！<a href="#" onclick="logout()">退出</a></span>
    </div>

    <div class="post-box">
      <textarea id="content" placeholder="说点什么..."></textarea>
      <button onclick="postMsg()">发布留言</button>
      <div class="clear"></div>
    </div>

    <div id="list"></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <p id="modal-text"></p>
    <div class="modal-buttons" id="modal-btns"></div>
  </div>
</div>

<script>
// ===== 新增：读取 URL 参数 ?user=xxx 自动预填用户名 =====
(function(){
  const params = new URLSearchParams(window.location.search);
  const u = params.get('user');
  if(u){
    const loginInput = document.getElementById('login-user');
    const regInput = document.getElementById('reg-user');
    if(loginInput) loginInput.value = u;
    if(regInput) regInput.value = u;
  }
})();

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function showLogin(){document.getElementById('login-view').classList.remove('hidden');document.getElementById('reg-view').classList.add('hidden');clearAlert()}
function showReg(){document.getElementById('reg-view').classList.remove('hidden');document.getElementById('login-view').classList.add('hidden');clearAlert()}
function clearAlert(){document.getElementById('login-alert').innerHTML='';document.getElementById('reg-alert').innerHTML=''}

function alertBox(id,msg,type){document.getElementById(id).innerHTML='<div class="alert '+type+'">'+esc(msg)+'</div>'}

async function register(){
  const username=document.getElementById('reg-user').value.trim();
  const password=document.getElementById('reg-pass').value;
  const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const d=await r.json().catch(()=>({}));
  if(r.ok){alertBox('reg-alert','注册成功，请登录','success');setTimeout(showLogin,1200);}
  else alertBox('reg-alert',d.message||'注册失败','error');
}

async function login(){
  const username=document.getElementById('login-user').value.trim();
  const password=document.getElementById('login-pass').value;
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const d=await r.json().catch(()=>({}));
  if(r.ok) location.reload();
  else alertBox('login-alert',d.message||'登录失败','error');
}

async function logout(){
  await fetch('/api/logout',{method:'POST'});
  location.reload();
}

async function postMsg(){
  const content=document.getElementById('content').value.trim();
  if(!content){showModal('请输入留言内容');return;}
  const r=await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});
  if(r.ok){document.getElementById('content').value='';load();}
  else{const d=await r.json().catch(()=>({}));showModal(d.message||'发布失败');}
}

async function load(){
  const r=await fetch('/api/messages');
  if(!r.ok){showModal('加载留言失败（状态码：'+r.status+'）');return;}
  const d=await r.json();
  if(d.loggedIn){
    document.getElementById('auth').classList.add('hidden');
    document.getElementById('board').classList.remove('hidden');
    document.getElementById('uname').innerText=d.username||'';
    if(!d.messages.length){document.getElementById('list').innerHTML='<div class="empty">还没有留言，来做第一个吧！</div>';return;}
    document.getElementById('list').innerHTML=d.messages.map(m=>{
      const acts=['<button class="btn-action" onclick="selectAll('+m.id+')">全选</button>',
                  '<button class="btn-action" onclick="copyMsg('+m.id+')">复制</button>'];
      if(m.mine) acts.push('<button class="btn-action btn-delete" onclick="delMsg('+m.id+')">删除</button>');
      return '<div class="msg-card"><div class="msg-meta"><div class="avatar">'+esc((m.username||'?').slice(0,1))+'</div>'+
        '<div class="msg-info"><div class="name">'+esc(m.username)+'</div><div class="time">'+esc(m.created_at)+'</div></div>'+
        '<div class="msg-actions">'+acts.join('')+'</div></div>'+
        '<div class="msg-content" id="mc-'+m.id+'">'+esc(m.content)+'</div></div>';
    }).join('');
  }else{
    document.getElementById('auth').classList.remove('hidden');
    document.getElementById('board').classList.add('hidden');
  }
}

function selectAll(id){const el=document.getElementById('mc-'+id);const rg=document.createRange();rg.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(rg);}
function copyMsg(id){const el=document.getElementById('mc-'+id);navigator.clipboard.writeText(el.innerText).then(()=>showModal('复制成功'),()=>showModal('复制失败'));}
function delMsg(id){showModal('确定要删除这条留言吗？',()=>fetch('/api/messages-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}).then(load));}

let cb=null;
function showModal(text,confirmCb){document.getElementById('modal-text').innerText=text;const b=document.getElementById('modal-btns');b.innerHTML='';
  if(confirmCb){cb=confirmCb;b.innerHTML='<button class="modal-btn cancel" onclick="closeModal()">取消</button><button class="modal-btn primary" onclick="okModal()">确定</button>';}
  else{b.innerHTML='<button class="modal-btn primary" onclick="closeModal()">确定</button>';}
  document.getElementById('modal').classList.add('active');}
function closeModal(){document.getElementById('modal').classList.remove('active');cb=null;}
function okModal(){if(cb)cb();closeModal();}

load();
</script>
</body>
</html>
